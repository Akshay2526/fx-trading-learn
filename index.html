<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Forex Trading Coaching in Dehradun | Stratum FX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>body { padding-top: 80px; }</style>
</head>
<body class="bg-black text-white font-sans antialiased">

  <header class="border-b border-gray-900 bg-black/80 backdrop-blur-md fixed top-0 w-full z-50">
    <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-xl font-black tracking-wider text-white">STRATUM <span class="text-red-600">FX</span></span>
      </div>
      <div class="hidden md:flex space-x-8 text-sm font-medium uppercase text-gray-400">
        <a href="index.html" class="hover:text-white">Home</a>
        <a href="course.html" class="hover:text-white">Course</a>
      </div>
      <button id="menu-btn" class="md:hidden text-white"><i class="fa-solid fa-bars text-2xl"></i></button>
    </nav>
  </header>

  <main>
    <section id="register" class="px-6 py-12 max-w-3xl mx-auto">
      <div class="border border-gray-900 p-8 rounded-2xl bg-gray-950">
        <h3 class="text-2xl font-black text-center mb-8">COURSE REGISTRATION</h3>
        <form action="https://script.google.com/macros/s/AKfycbwbHKWkpvZSxXs88MWjxTwyzR8Y7AiFxP0W3YfkmLnSoBbkwtzohkMdvergViMUA70b2g/exec" method="POST" id="registrationForm" class="space-y-4">
          <input type="text" name="name" placeholder="Full Name" required class="w-full bg-gray-900 p-3 rounded border border-gray-800">
          <input type="email" name="email" placeholder="Email Address" required class="w-full bg-gray-900 p-3 rounded border border-gray-800">
          <input type="tel" name="phone" placeholder="Phone Number" required class="w-full bg-gray-900 p-3 rounded border border-gray-800">
          <select name="course" required class="w-full bg-gray-900 p-3 rounded border border-gray-800 text-gray-400">
            <option value="">Select Your Course *</option>
            <option value="Beginner Stock Market Course">Beginner Stock Market Course</option>
            <option value="SMC & Support Resistance Course">SMC & Support Resistance Course</option>
          </select>
          <button type="submit" class="w-full bg-red-600 py-3 rounded font-bold uppercase">Register Now</button>
        </form>
      </div>
    </section>

    <section id="contact" class="px-6 py-20 max-w-3xl mx-auto border-t border-gray-900">
       <h3 class="text-2xl font-bold mb-8">Contact Us</h3>
       <form action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
         <input type="hidden" name="access_key" value="1fd5d438-0cd2-4804-a3b4-865b4342e68a">
         <input type="hidden" name="redirect" value="https://fx-trading-learn.vercel.app/index.html">
         <input type="text" name="name" placeholder="Name" required class="w-full bg-gray-900 p-3 rounded border border-gray-800">
         <textarea name="message" placeholder="Message" required class="w-full bg-gray-900 p-3 rounded border border-gray-800"></textarea>
         <button type="submit" class="w-full bg-gray-800 py-3 rounded">Send Message</button>
       </form>
    </section>
  </main>

  <script>
    // Registration form redirect logic
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
      setTimeout(() => { window.location.href = "https://fx-trading-learn.vercel.app/course.html"; }, 1000);
    });
  </script>
</body>
</html>
